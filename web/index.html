<!-- web/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FactorMachine Panel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <link rel="stylesheet" href="/common/style.css">
    <script src="https://cdn.jsdelivr.net/npm/klinecharts@10.0.0-beta1/dist/umd/klinecharts.min.js"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">FactorMachine</div>
        <nav class="nav-list">
            <div class="nav-item active" onclick="switchView('dashboard', this)">首页状态</div>
            <div class="nav-item" onclick="switchView('tasks', this)">任务执行</div>
            <div class="nav-item" onclick="switchView('logs', this)">日志查看</div>
            <div class="nav-item" onclick="switchView('kline', this)">K线查看</div>
            <div class="nav-item" onclick="switchView('hft', this)">高频查看</div>
        </nav>
    </aside>
    <main class="main-content">
        <header class="header" id="page-title">首页状态</header>
        <section class="content-body" id="view-container"></section>
    </main>
    <script src="/common/script.js"></script>
</body>
</html>
